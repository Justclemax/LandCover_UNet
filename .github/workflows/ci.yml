name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-group pipeline
      - run: uv run ruff check .
      - run: uv run pytest

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            serving/target
            data/raw
          key: rust-${{ hashFiles('serving/Cargo.lock') }}-${{ hashFiles('src/landcover/config.py') }}
      # Rebuild scene.bin from the public rasters (SHA-256 checked) so the parity tests run for real.
      - run: uv sync --frozen --no-default-groups && uv run --no-sync python -m landcover.export --scene-only
      - working-directory: serving
        run: |
          cargo fmt --check
          cargo clippy --release --all-targets --locked -- -D warnings
          cargo test --release --locked
